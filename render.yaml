services:
  - type: web
    name: balaji-backend
    env: python
    buildCommand: "./render_build.sh"
    startCommand: "bash ./render_start.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: balaji-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*" # Change this to your domain later

databases:
  - name: balaji-db
    plan: free
